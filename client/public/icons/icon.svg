<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Cart -->
  <g transform="translate(0, 12)">
    <!-- Handle -->
    <path d="M 130 160 L 160 160 L 195 320 L 380 320 L 405 200 L 175 200"
          fill="none" stroke="url(#cart)" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wheels -->
    <circle cx="215" cy="365" r="22" fill="url(#cart)"/>
    <circle cx="355" cy="365" r="22" fill="url(#cart)"/>

    <!-- XMARKET dot accent -->
    <circle cx="256" cy="256" r="0" fill="none"/>
  </g>

  <!-- Optional shine -->
  <ellipse cx="256" cy="80" rx="180" ry="40" fill="rgba(255,255,255,0.08)"/>
</svg>
